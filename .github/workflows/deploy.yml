name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Writes public/availability.json. Exits non-zero on any error, which stops the
      # job before deploy and leaves the currently live site untouched.
      - name: Refresh availability from Google Calendar
        env:
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
        run: node scripts/fetch-availability.mjs

      - name: Build
        run: npm run build

      # Renders /, /pricing, /faq, /request to static HTML so AI and search crawlers that
      # don't run JavaScript see the page text, and those URLs return 200 instead of 404.
      # Fails the job (live site untouched) if any page doesn't render.
      - name: Install Chromium for pre-rendering
        run: npx playwright install --with-deps chromium

      - name: Pre-render pages
        run: npm run prerender

      # Vite outputs to dist/ by default
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Tells Bing (and other IndexNow engines; Google doesn't participate) that the pages changed,
  # so they recrawl in hours instead of whenever. Runs only for real site changes (pushes and
  # manual runs), not the 4x-daily availability refreshes. A failure here never affects the
  # live site; the deploy has already finished.
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Submit sitemap URLs to IndexNow
        run: |
          KEY_FILE=$(ls public | grep -E '^[0-9a-f]{32}\.txt$' | head -1)
          KEY="${KEY_FILE%.txt}"
          URLS=$(grep -o '<loc>[^<]*</loc>' public/sitemap.xml | sed -E 's#</?loc>##g' | jq -R . | jq -sc .)
          BODY=$(jq -nc --arg key "$KEY" --argjson urls "$URLS" \
            '{host: "printkitnyc.com", key: $key, keyLocation: ("https://printkitnyc.com/" + $key + ".txt"), urlList: $urls}')
          echo "Submitting: $BODY"
          CODE=$(curl -s -o response.txt -w "%{http_code}" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" -d "$BODY")
          echo "IndexNow responded $CODE"; cat response.txt
          # 200 = accepted, 202 = accepted, key check pending. Anything else needs a look.
          [ "$CODE" = "200" ] || [ "$CODE" = "202" ]
